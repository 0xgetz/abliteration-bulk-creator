<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Abliteration Bulk Creator logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a1f"/>
      <stop offset="0.55" stop-color="#141235"/>
      <stop offset="1" stop-color="#1d1440"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a3c"/>
      <stop offset="0.5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded app tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
  <circle cx="256" cy="215" r="205" fill="url(#halo)"/>

  <!-- orbital rings = "bulk / fleet" -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ring)" stroke-width="3.5" opacity="0.30"/>
  <ellipse cx="256" cy="256" rx="168" ry="66" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.42" transform="rotate(-26 256 256)"/>
  <ellipse cx="256" cy="256" rx="168" ry="66" fill="none" stroke="url(#cyan)" stroke-width="2.5" opacity="0.30" transform="rotate(26 256 256)"/>

  <!-- central "unlocked flame" = abliteration -->
  <g filter="url(#glow)">
    <path d="M256 138
             C 300 190, 322 214, 322 262
             C 322 300, 294 330, 256 330
             C 218 330, 190 300, 190 262
             C 190 232, 206 214, 224 196
             C 224 222, 236 236, 248 240
             C 240 216, 240 176, 256 138 Z"
          fill="url(#flame)" opacity="0.96"/>
    <path d="M256 196
             C 278 224, 288 240, 288 264
             C 288 283, 274 298, 256 298
             C 238 298, 224 283, 224 264
             C 224 250, 232 240, 244 230
             C 244 246, 252 252, 258 254
             C 252 238, 252 216, 256 196 Z"
          fill="#fff3c4" opacity="0.9"/>
  </g>

  <!-- lightning bolt = API / power -->
  <g filter="url(#softglow)" transform="translate(0,-6)">
    <path d="M370 176 L330 246 L360 246 L338 306 L392 228 L362 228 Z"
          fill="url(#cyan)" stroke="#eafcff" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- fleet nodes on the orbit -->
  <g filter="url(#softglow)">
    <circle cx="256" cy="88"  r="12" fill="#38bdf8"/>
    <circle cx="418" cy="256" r="10" fill="#a855f7" opacity="0.95"/>
    <circle cx="256" cy="424" r="10" fill="#22d3ee" opacity="0.95"/>
    <circle cx="94"  cy="256" r="10" fill="#ec4899" opacity="0.9"/>
  </g>

  <!-- key badge (bottom-right) = minted API key -->
  <g transform="translate(316,300)">
    <rect x="0" y="0" width="150" height="150" rx="34" fill="#0b0a1f" stroke="url(#violet)" stroke-width="3"/>
    <g filter="url(#softglow)">
      <circle cx="46" cy="56" r="22" fill="none" stroke="url(#violet)" stroke-width="9"/>
      <path d="M62 70 L98 106" stroke="url(#violet)" stroke-width="9" stroke-linecap="round"/>
      <path d="M86 94 L100 80" stroke="url(#cyan)" stroke-width="9" stroke-linecap="round"/>
      <path d="M72 80 L86 66" stroke="url(#cyan)" stroke-width="9" stroke-linecap="round"/>
    </g>
    <text x="46" y="132" font-family="'SFMono-Regular',Consolas,monospace" font-size="22" fill="#c4b5fd" text-anchor="middle">ak_</text>
  </g>
</svg>
